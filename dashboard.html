<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MSP Treasure Hunt Dashboard</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: projector board; ranking left, question heat map right; MSP palette */
:root{--ink:#0f2a33;--muted:#5b6f77;--bg:#eef3f5;--card:#fff;--line:#d9e3e7;--deep:#00313C;--blue:#1671B9;--navy:#1A497D;--sky:#2B9FD2;--purple:#913694;--coral:#DD5D51;--gold:#E2A93B;--pine:#068674;
--display:"Oswald","Arial Narrow",Arial,sans-serif;--body:"Source Sans 3","Segoe UI",Helvetica,Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
body{font-family:var(--body);background:var(--bg);color:var(--ink)}
header{background:var(--deep);color:#fff;padding:18px max(16px,3vw);display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center}
.kick{font-family:var(--display);letter-spacing:.14em;text-transform:uppercase;font-size:14px;color:#9fdcf3}
h1{font-family:var(--display);font-weight:600;font-size:clamp(26px,3.2vw,40px);line-height:1.05}
.ctl{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ctl button{font:inherit;font-weight:700;border:2px solid rgba(255,255,255,.25);background:transparent;color:#fff;border-radius:10px;padding:8px 14px;cursor:pointer}
.ctl button.on{background:#fff;color:var(--deep);border-color:#fff}
.live{font-size:14px;color:#cfe6ee;display:flex;gap:8px;align-items:center}
.live i{width:10px;height:10px;border-radius:50%;background:#6FB477;box-shadow:0 0 0 0 rgba(111,180,119,.6);animation:p 2s infinite}
@keyframes p{70%{box-shadow:0 0 0 10px rgba(111,180,119,0)}100%{box-shadow:0 0 0 0 rgba(111,180,119,0)}}
@media (prefers-reduced-motion:reduce){.live i{animation:none}}
main{padding:20px max(16px,3vw);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:20px}
@media (max-width:900px){main{grid-template-columns:1fr}}
.card{background:var(--card);border-radius:16px;padding:18px;box-shadow:0 1px 0 var(--line),0 8px 24px rgba(0,49,60,.06);min-width:0}
h2{font-family:var(--display);font-weight:600;font-size:20px;letter-spacing:.04em;margin-bottom:12px;color:var(--deep)}
.rank{display:grid;gap:10px}
.r{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:10px 12px;border-radius:12px;background:#f5f8f9}
.r .pos{font-family:var(--display);font-size:26px;color:var(--muted);text-align:center}
.r.first{background:#fff6e2;outline:2px solid var(--gold)}
.r.first .pos{color:var(--gold)}
.r .g{font-weight:700;font-size:20px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r .meta{font-size:13px;color:var(--muted)}
.r .sc{font-family:var(--display);font-size:34px;font-variant-numeric:tabular-nums;color:var(--deep)}
.r .sc small{font-size:16px;color:var(--muted)}
.r .bar{grid-column:2/4;height:7px;border-radius:4px;background:#e3eaed;overflow:hidden}
.r .bar span{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--pine))}
.empty{color:var(--muted);padding:24px 8px;text-align:center}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:560px;font-variant-numeric:tabular-nums}
th,td{padding:8px 6px;text-align:center;border-bottom:1px solid var(--line);font-size:16px}
th{font-family:var(--display);font-weight:400;color:var(--muted);font-size:14px;letter-spacing:.04em}
td.gn{text-align:left;font-weight:700;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
td.c{font-weight:700;border-radius:6px}
.full{background:#e1f3ec;color:var(--pine)} .part{background:#fff3d9;color:#9a6700} .zero{background:#fdeceb;color:#b5473c}
tr.avg td{font-weight:700;background:#f1f6fa}
.foot{grid-column:1/-1;color:var(--muted);font-size:13px}
</style>
</head>
<body>
<header>
  <div><div class="kick" id="kick">Day 1 · 4 November 2026</div><h1>Treasure Hunt: live scores</h1></div>
  <div class="ctl">
    <span class="live" id="live"><i></i><span id="st">Connecting…</span></span>
    <button id="b1" class="on">Day 1</button><button id="b2">Day 2</button>
  </div>
</header>
<main>
  <section class="card"><h2>Ranking</h2><div class="rank" id="rank"><div class="empty">Scores appear here as groups submit.</div></div></section>
  <section class="card"><h2>Points per question</h2><div class="tw"><table id="tbl"></table></div></section>
  <p class="foot">Refreshes every 10 seconds. If a group submits twice, its latest submission counts.</p>
</main>
<script src="config.js"></script>
<script>
const LAB={1:['Q1','Q2','Q3','Q4','Q5','★','Q6','Q7','Q8','Q9'],2:['Q1','Q2','Q3','Q4','Q5','★','Q6','Q7','Q8','Q9']};
const PTS={1:[2,1,1,1,2,1,1,2,2,1],2:[2,1,1,2,2,1,4,1,2,3]};
let day=1,timer=null;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function setDay(d){day=d;document.getElementById('b1').className=d===1?'on':'';document.getElementById('b2').className=d===2?'on':'';
  document.getElementById('kick').textContent=d===1?'Day 1 · 4 November 2026':'Day 2 · 5 November 2026';load();}
document.getElementById('b1').onclick=()=>setDay(1);document.getElementById('b2').onclick=()=>setDay(2);
function render(rows){
  const latest={};rows.forEach(r=>{latest[String(r.group).trim().toLowerCase()]=r});
  const list=Object.values(latest).sort((a,b)=>(b.score+b.bonus)-(a.score+a.bonus)||a.minutes-b.minutes);
  const rk=document.getElementById('rank');
  if(!list.length){rk.innerHTML='<div class="empty">Scores appear here as groups submit.</div>';document.getElementById('tbl').innerHTML='';return}
  const top=list[0].score+list[0].bonus;
  rk.innerHTML=list.map((r,i)=>`<div class="r ${r.score+r.bonus===top?'first':''}"><div class="pos">${r.score+r.bonus===top?'🏆':i+1}</div>
    <div><div class="g">${esc(r.group)}</div><div class="meta">${/^\d\d:\d\d$/.test(String(r.at))?'submitted '+esc(r.at)+' · ':''}${r.minutes} min${r.bonus?' · +'+r.bonus+' bonus':''}</div></div>
    <div class="sc">${r.score}<small> / ${r.max}</small></div><div class="bar"><span style="width:${Math.round(100*r.score/(r.max||1))}%"></span></div></div>`).join('');
  const L=LAB[day],P=PTS[day];
  let h='<tr><th style="text-align:left">Group</th>'+L.map((l,i)=>`<th>${l}<br><small>(${P[i]})</small></th>`).join('')+'</tr>';
  list.forEach(r=>{h+=`<tr><td class="gn">${esc(r.group)}</td>`+P.map((p,i)=>{const v=Number(r.per[i])||0;return `<td class="c ${v>=p?'full':v>0?'part':'zero'}">${v}</td>`}).join('')+'</tr>'});
  h+='<tr class="avg"><td class="gn">Average</td>'+P.map((p,i)=>{const a=list.reduce((s,r)=>s+(Number(r.per[i])||0),0)/list.length;return `<td>${a.toFixed(1)}</td>`}).join('')+'</tr>';
  document.getElementById('tbl').innerHTML=h;
}
function load(){
  const st=document.getElementById('st'),ep=window.TH_ENDPOINT;
  if(!ep){st.textContent='Not connected yet';return}
  fetch(ep+'?day='+day,{cache:'no-store'}).then(r=>r.json()).then(j=>{render(j.rows||[]);st.textContent='Live · updated '+new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'})})
    .catch(()=>{st.textContent='Connection lost, retrying'});
}
load();setInterval(load,10000);
</script>
</body>
</html>
